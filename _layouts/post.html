---
layout: default
---
<header>
  <h1>{{ page.title }}</h1>
  {% if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}
  <p class="meta">{% if page.place %}<span>{{ page.place }}</span> &middot; {% endif %}<span>{{ page.date | date: "%B %Y" }}</span></p>
</header>

<article>
{{ content }}
</article>
